<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Drama</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f4f4; color: #000; }
    header { background: #1a1a1a; color: #fff; text-align: center; padding: 16px; font-size: 24px; font-weight: bold; }
    .search-bar { margin: 12px auto; max-width: 400px; display: flex; }
    .search-bar input { flex: 1; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; }
    .search-bar button { padding: 8px 16px; font-size: 16px; border: 1px solid #ccc; border-left: none; background: #ff3b3b; color: #fff; border-radius: 0 4px 4px 0; cursor: pointer; }
    .reel-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 12px; }
    .reel-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
    .reel-card:hover { transform: scale(1.03); }
    .reel-card img { width: 100%; height: auto; display: block; }
    .reel-card .title { padding: 8px; font-size: 14px; font-weight: bold; text-align: center; }
    footer { text-align: center; padding: 12px; font-size: 12px; color: #666; }
  </style>
</head>
<body>

<header>Tap Drama</header>

<div class="search-bar">
  <input type="text" placeholder="Search dramas...">
  <button>Search</button>
</div>

<div class="reel-container">
  <div class="reel-card">
    <img src="https://i.imgur.com/abcd123.jpg" alt="Rich, Single & Desired">
    <div class="title">Rich, Single & Desired</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/efgh456.jpg" alt="Marry and Conquer">
    <div class="title">Marry and Conquer</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/ijkl789.jpg" alt="Trash the Past, Own Myself">
    <div class="title">Trash the Past, Own Myself</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/mnop012.jpg" alt="The Time-Traveling Special Agent">
    <div class="title">The Time-Traveling Special Agent</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/qrst345.jpg" alt="Lottery System Dad">
    <div class="title">Lottery System Dad</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/uvwx678.jpg" alt="Warning! Handle Him at Your Risk">
    <div class="title">Warning! Handle Him at Your Risk</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/yza9012.jpg" alt="Alchemy of Love">
    <div class="title">Alchemy of Love</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/bcde345.jpg" alt="Trouble in Paradise">
    <div class="title">Trouble in Paradise</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/fghi678.jpg" alt="Hit Me Hard">
    <div class="title">Hit Me Hard</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/jklm901.jpg" alt="Love & Revenge">
    <div class="title">Love & Revenge</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/nopq234.jpg" alt="Secret Kingdom">
    <div class="title">Secret Kingdom</div>
  </div>
  <div class="reel-card">
    <img src="https://i.imgur.com/rstu567.jpg" alt="Fate to Rewrite">
    <div class="title">Fate to Rewrite</div>
  </div>
</div>

<footer>© 2026 Tap Drama | All rights reserved</footer>

</body>
</html>
