<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Drama</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000; /* Black background */
      color: #fff;
    }

    header {
      background-color: #111;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .search-bar input {
      width: 70%;
      padding: 10px;
      border-radius: 5px 0 0 5px;
      border: none;
      font-size: 16px;
    }

    .search-bar button {
      padding: 10px 20px;
      border: none;
      background-color: #e74c3c;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border-radius: 0 5px 5px 0;
    }

    .drama-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 0 15px 30px 15px;
    }

    .drama-card {
      background-color: #111;
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      transition: transform 0.2s;
      cursor: pointer;
    }

    .drama-card:hover {
      transform: scale(1.05);
    }

    .drama-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .drama-card p {
      margin: 10px 0;
      font-weight: bold;
      font-size: 14px;
      padding: 0 5px;
    }
  </style>
</head>
<body>

  <header>Tap Drama</header>

  <div class="search-bar">
    <input type="text" placeholder="Search dramas...">
    <button>Search</button>
  </div>

  <div class="drama-grid">
    <div class="drama-card">
      <img src="IMAGE_URL_1" alt="Rich, Single & Desired">
      <p>Rich, Single & Desired</p>
    </div>
    <div class="drama-card">
      <img src="IMAGE_URL_2" alt="Marry and Conquer">
      <p>Marry and Conquer</p>
    </div>
    <div class="drama-card">
      <img src="IMAGE_URL_3" alt="Trash the Past, Own Myself">
      <p>Trash the Past, Own Myself</p>
    </div>
    <div class="drama-card">
      <img src="IMAGE_URL_4" alt="Time-Traveling Special Agent">
      <p>Time-Traveling Special Agent</p>
    </div>
    <div class="drama-card">
      <img src="IMAGE_URL_5" alt="Lottery System Dad">
      <p>Lottery System Dad</p>
    </div>
    <div class="drama-card">
      <img src="IMAGE_URL_6" alt="Warning! Handle Him at Your Risk">
      <p>Warning! Handle Him at Your Risk</p>
    </div>
    <!-- Add more drama cards here -->
  </div>

</body>
</html>
